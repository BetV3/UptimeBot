name: Build and push worker image

# Triggers on any push to master that touches worker code, the
# Dockerfile, or this workflow. Also exposes workflow_dispatch so you
# can force a rebuild from the Actions tab without code changes.
on:
  push:
    branches: [master]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-image.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR image names are required to be lowercase; the GitHub owner
      # name may be mixed case, so normalize it.
      - name: Lowercase image owner
        id: img
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.owner }}/uptimebot-worker:latest
            ghcr.io/${{ steps.img.outputs.owner }}/uptimebot-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
