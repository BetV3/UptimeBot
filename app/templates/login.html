{% extends "base.html" %}
{% block title %}Login — BotOps Cloud{% endblock %}
{% block nav %}{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center -mt-8">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <a href="/" class="inline-block">
                <h1 class="font-mono text-2xl font-bold text-ink">BotOps<span class="text-brand">Cloud</span></h1>
            </a>
            <p class="text-ink-dim text-sm mt-2 font-mono">// sign in to your control panel</p>
        </div>

        {% if error %}
        <div class="bg-bad/10 border border-bad/30 text-bad text-sm rounded-md px-4 py-3 mb-4 font-mono">
            &gt; {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/dashboard/login" class="bc-card p-6 space-y-5 shadow-glow">
            <div>
                <label class="block text-xs font-mono uppercase tracking-wider text-ink-muted mb-2">Email</label>
                <input type="email" name="email" required autofocus>
            </div>
            <div>
                <label class="block text-xs font-mono uppercase tracking-wider text-ink-muted mb-2">Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="w-full bc-btn-primary justify-center py-2.5">
                Sign In
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
            </button>
        </form>
        <p class="text-center text-sm text-ink-dim mt-6">
            Don't have an account? <a href="/dashboard/register" class="text-brand hover:text-brand-hover transition font-medium">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
