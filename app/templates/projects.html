{% extends "base.html" %}
{% block title %}Projects — UptimeBot{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-xl font-bold">Projects</h1>
    <button onclick="document.getElementById('new-project-modal').classList.remove('hidden')"
        class="bg-brand text-white text-sm px-4 py-2 rounded-md hover:bg-purple-700 transition">
        New Project
    </button>
</div>

{% if not projects %}
<div class="bg-white rounded-lg shadow p-8 text-center">
    <p class="text-gray-500 mb-4">No projects yet. Create one to get started.</p>
</div>
{% endif %}

<div class="grid gap-4">
    {% for p in projects %}
    <a href="/dashboard/projects/{{ p.id }}" class="bg-white rounded-lg shadow p-5 hover:shadow-md transition block">
        <div class="flex items-center justify-between">
            <div>
                <h2 class="font-semibold text-gray-900">{{ p.name }}</h2>
                <p class="text-sm text-gray-500 mt-0.5">{{ p.slug }}</p>
            </div>
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </div>
    </a>
    {% endfor %}
</div>

<!-- New Project Modal -->
<div id="new-project-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
        <h2 class="text-lg font-semibold mb-4">New Project</h2>
        <form method="post" action="/dashboard/projects">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Project Name</label>
                <input type="text" name="name" required placeholder="My Discord Bot"
                    class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
            </div>
            <div class="flex justify-end gap-3">
                <button type="button" onclick="this.closest('#new-project-modal').classList.add('hidden')"
                    class="px-4 py-2 text-sm text-gray-700 hover:text-gray-900">Cancel</button>
                <button type="submit"
                    class="bg-brand text-white text-sm px-4 py-2 rounded-md hover:bg-purple-700">Create</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
