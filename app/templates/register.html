{% extends "base.html" %}
{% block title %}Register — UptimeBot{% endblock %}
{% block nav %}{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="w-full max-w-sm">
        <h1 class="text-2xl font-bold text-center mb-1">UptimeBot</h1>
        <p class="text-center text-gray-500 text-sm mb-6">Create your account</p>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-md px-4 py-3 mb-4">{{ error }}</div>
        {% endif %}

        <form method="post" action="/dashboard/register" class="bg-white rounded-lg shadow p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email" required
                    class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required minlength="6"
                    class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
            </div>
            <button type="submit"
                class="w-full bg-brand text-white rounded-md py-2 text-sm font-medium hover:bg-purple-700 transition">
                Create Account
            </button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-4">
            Already have an account? <a href="/dashboard/login" class="text-brand hover:underline">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
