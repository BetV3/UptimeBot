services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uptimebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: uptimebot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptimebot"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    # AOF with everysec fsync: recover in-flight Celery tasks on restart
    # with at most ~1s of loss. Without this, a hard crash between the
    # API dispatching a task and the worker picking it up is silent.
    command: redis-server --appendonly yes --appendfsync everysec --dir /data
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    env_file:
      - .env.dev
      - path: .env
        required: false
      - path: .env.local
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info -Q default
    volumes:
      - .:/code
    env_file:
      - .env.dev
      - path: .env
        required: false
      - path: .env.local
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-alerts-worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info -Q alerts --concurrency=4
    volumes:
      - .:/code
    env_file:
      - .env.dev
      - path: .env
        required: false
      - path: .env.local
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - .:/code
    env_file:
      - .env.dev
      - path: .env
        required: false
      - path: .env.local
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build: .
    # FLOWER_BASIC_AUTH must be set in .env.local as "user:password"; the
    # service will not start without it in prod.
    command: celery -A app.workers.celery_app flower --port=5555 --url_prefix=flower
    ports:
      - "5555:5555"
    volumes:
      - .:/code
    env_file:
      - .env.dev
      - path: .env
        required: false
      - path: .env.local
        required: false
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
